[project]
name = "oss-contribution-radar"
version = "0.1.0"
description = "Daily, review-gated discovery of genuine open-source contribution opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Navid Khan" }]
dependencies = []

[project.scripts]
contribution-radar = "contribution_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contribution_radar"]

[dependency-groups]
dev = [
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "--cov=contribution_radar --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["contribution_radar"]
